version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./tasks:/app/tasks
      - ./crew_tasks.db:/app/crew_tasks.db
      - ./checkpoints.db:/app/checkpoints.db
      - ./models.json:/app/models.json
      - ./.env:/app/.env
    environment:
      - PORT=8000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ALLOWED_ORIGINS=http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend/software-agent
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
